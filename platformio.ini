[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
extra_scripts = pre:tools/git_build_flags.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D GATHRA_DEFAULT_BUILD_FLAVOR=\"production\"
lib_deps =
    jgromes/RadioLib@7.7.1
    bblanchon/ArduinoJson@7.4.2

[env:hil]
extends = env:esp32-c3-devkitm-1
build_flags =
    ${env:esp32-c3-devkitm-1.build_flags}
    -D GATHRA_HIL_SYNTHETIC=1
    -D GATHRA_BUILD_FLAVOR=\"hil\"

[env:rollback-test]
extends = env:esp32-c3-devkitm-1
build_flags =
    ${env:esp32-c3-devkitm-1.build_flags}
    -D GATHRA_ROLLBACK_TEST_FAIL=1
    -D GATHRA_BUILD_FLAVOR=\"rollback-test\"

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = no
build_flags =
    -std=gnu++17
    -I include
lib_deps =
    bblanchon/ArduinoJson@7.4.2
